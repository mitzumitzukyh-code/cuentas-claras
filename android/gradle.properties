org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# El proyecto vive en D: y la caché de pub en C:, y el compilador incremental
# de Kotlin no sabe relativizar rutas entre dos unidades: revienta con
# "this and base files have different roots" y detrás arrastra un
# "Could not close incremental caches" que tumba el build entero. Solo pasa en
# Windows con el código repartido en dos discos. Apagar el incremental cuesta
# unos segundos por compilación y evita el fallo.
kotlin.incremental=false
