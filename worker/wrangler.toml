name = "cuenta-clara-tasa"
main = "src/index.js"
compatibility_date = "2026-07-19"

# Cada media hora. Los Cron Triggers estan incluidos en el plan gratuito.
#
# Era cada hora en punto, y pasó a media hora por los avisos de corte de luz:
# el aviso sale 30 minutos antes del corte y las franjas empiezan en hora en
# punto, así que el momento que hay que acertar es y media. Lo demás —tasa,
# resumen de ventas, stock— sigue corriendo solo en la pasada del minuto 0.
[triggers]
crons = ["0,30 * * * *"]

# Guarda la ultima tasa, el historial de 14 dias y el token OAuth cacheado.
# El id real se rellena al crear el namespace:
#   wrangler kv namespace create TASAS
[[kv_namespaces]]
binding = "TASAS"
id = "3f64d5a11c704dc0837d0933f4a6cd81"
# Namespace aparte para `wrangler dev`, que se niega a arrancar si el de
# desarrollo es el mismo de produccion — con razon: una prueba no debe poder
# pisar la tasa del dia ni el token OAuth cacheado de los usuarios reales.
preview_id = "958d8318467c4984b768eb47591dcbb8"

# Web API key de Firebase: NO es secreta (identifica el proyecto, no
# autoriza nada por si sola), es la misma que ya va en firebase_options.dart.
# Se usa para verificar la sesion de quien llama a /leer-etiqueta.
[vars]
FIREBASE_WEB_API_KEY = "AIzaSyCccPlUrPY6QVRpDkGbwwjHoD1i-QZoAx8"
# Modelo de Gemini para /leer-etiqueta. Cambiar aqui (y `wrangler deploy`) si
# el modelo por defecto de gemini.js queda obsoleto, sin tocar la app.
GEMINI_MODELO = "gemini-2.5-flash"
# El nombre del cloud tampoco es secreto (ya iba embebido en el APK antes);
# lo que nunca debe salir del Worker es la API Secret que lo firma.
CLOUDINARY_CLOUD_NAME = "jwahaxid"

# Secretos (NO van aqui, se cargan aparte y quedan cifrados en Cloudflare):
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT   <- el JSON de la cuenta
#   wrangler secret put TOKEN_MANUAL               <- para el endpoint /revisar
#   wrangler secret put GEMINI_API_KEY              <- clave de Google AI Studio
#   wrangler secret put CLOUDINARY_API_KEY          <- panel de Cloudinary > Settings > API Keys
#   wrangler secret put CLOUDINARY_API_SECRET       <- el mismo panel, junto a la API Key
