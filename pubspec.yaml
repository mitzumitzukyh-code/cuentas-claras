name: cuentaclara
description: "Cuenta Clara - Gestion para pymes en Venezuela"
publish_to: 'none'

# versionName (Android) / CFBundleShortVersionString (iOS) = 1.0.0
# versionCode (Android) / CFBundleVersion (iOS)           = 1
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Firebase ---
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5

  # --- Estado y navegacion ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # --- Autenticacion ---
  google_sign_in: ^6.3.0         # login principal (Google)
  # Guarda credenciales cifradas (Keystore) para RE-AUTENTICAR al abrir la app
  # cuando la persistencia nativa de Firebase Auth no restaura la sesion. En
  # release, sobre el ROM del Z2464N, `currentUser` quedaba en null tras cerrar
  # y reabrir aunque el login hubiera sido correcto (verificado 2026-07-22). Ver
  # `AuthRepository.restaurarSesion`.
  flutter_secure_storage: ^9.2.2
  # Nota: se descarto el login por SMS (verifyPhoneNumber) por su costo, asi que
  # `sms_autofill` ya no se usa y se removio del proyecto.

  # --- Funcionalidades (brief §2) ---
  mobile_scanner: ^6.0.10        # escaneo de codigo de barras
  image_picker: ^1.1.2           # fotos de producto
  share_plus: ^10.1.4            # compartir catalogo/estado
  flutter_local_notifications: ^18.0.1  # recordatorios locales
  timezone: ^0.9.4               # zona horaria de los recordatorios programados
  # Nota: el brief listaba `open_mail_app` para abrir la bandeja de correo, pero
  # esa libreria esta sin mantenimiento y rompe el build con AGP 8 (no declara
  # `namespace`). Se usa url_launcher con esquema `mailto:` en su lugar.
  url_launcher: ^6.3.2           # abrir app de correo (iOS: esquema message:)
  android_intent_plus: ^5.3.0    # abrir la bandeja de correo en Android
  excel: ^4.0.6                  # importar productos desde Excel
  in_app_purchase: ^3.2.2        # suscripcion Premium

  # --- Utilidades ---
  connectivity_plus: ^6.1.3      # detectar sin señal antes de cobrar (offline)
  http: ^1.3.0                   # API tasa BCV (ve.dolarapi.com)
  intl: ^0.20.2                  # formato de numeros/moneda (tabular)
  shared_preferences: ^2.5.3     # cache de tasa BCV + config local
  path_provider: ^2.1.5          # carpeta temporal para catalogo/estado PNG
  google_fonts: ^6.2.1           # Inter / Poppins
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.1
  permission_handler: ^12.0.3
  cached_network_image: ^3.4.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  # Fuente del diseño empaquetada (antes se bajaba en runtime con google_fonts y
  # caía a Roboto sin red). Pesos 400/500/600/700/800 = los que usa el sistema.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
